name: Fieldnote PR validation
on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "migrations/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Configure disposable local test environment
        run: |
          cat > .env.local <<'EOF'
          APP_MODE=local
          APP_ORIGIN=http://localhost:3000
          BETTER_AUTH_SECRET=ci-only-non-production-secret-0123456789abcdef
          AI_MODE=demo
          AI_DAILY_ATTEMPT_LIMIT=100
          EOF
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
